<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <!--?========> Favicon <========-->
    <link rel="icon" href="./images/quiz.png" />
    <!--?========> Google Fonts <========-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--?========> Bootstrap Icons <========-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css"
      integrity="sha512-ZnR2wlLbSbr8/c9AgLg3jQPAattCUImNsae6NHYnS9KrIwRdcY9DxFotXhNAKIKbAXlRnujIqUWoXXwqyFOeIQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!--?========> Bootstrap Style Sheet <========-->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css"
      integrity="sha512-Z/def5z5u2aR89OuzYcxmDJ0Bnd5V1cKqBEbvLOiUNWdg9PQeXVvXLI90SE4QOHGlfLqUnDNVAYyZi8UwUTmWQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!--?========> Animate.CSS <========-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      integrity="sha512-c42qTSw/wPZ3/5LBzD+Bw5f7bSF2oxou6wEb+I/lqeaKV5FDIfMvvRp772y4jcJLKuGUOpbJMdg/BTl50fJYAw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!--?========> Main style Sheet <========-->
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>

  <body>
    <main class="min-vh-100 d-flex justify-content-center align-items-center">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6 col-md-8 col-sm-10">
            <div class="quiz-card animate__animated animate__fadeInUp">
              <div class="heading text-center mb-4">
                <h1 class="mb-0">Quiz App</h1>
              </div>

              <form
                class="start-quiz d-flex flex-column gap-4"
                id="quizOptions"
              >
                <div class="form-group">
                  <label for="categoryMenu" class="form-label">Category</label>
                  <select
                    class="form-select form-select-lg"
                    id="categoryMenu"
                    aria-label="category Select"
                  >
                    <option selected value="">Any Category</option>
                    <option value="9">General Knowledge</option>
                    <option value="27">Animals</option>
                    <option value="19">Science: Mathematics</option>
                    <option value="18">Science: Computers</option>
                    <option value="22">Geography</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="difficultyOptions" class="form-label"
                    >Difficulty</label
                  >
                  <select
                    class="form-select form-select-lg"
                    id="difficultyOptions"
                    aria-label="difficulty Select"
                  >
                    <option selected value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="questionsNumber" class="form-label"
                    >Number of Questions</label
                  >
                  <input
                    type="number"
                    class="form-control form-control-lg"
                    id="questionsNumber"
                    placeholder="e.g. 10"
                  />
                </div>

                <button
                  type="button"
                  class="btn btn-start w-100 py-3 mt-2"
                  id="startQuiz"
                >
                  Start Quiz
                </button>
              </form>

              <div class="questions-container mt-4"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!--!========> JS Main file <========-->
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
